# Red Hat OpenShift Service Mesh (classic, Maistra-based v2.x API — the lab content
# references `maistra.io/v1` ServiceMeshMember and a ServiceMeshControlPlane named
# "basic", which is the classic architecture, not the newer Sail/Istio-native operator).
#
# These three operators (Kiali, distributed tracing/Jaeger, Service Mesh) are installed
# cluster-wide into openshift-operators, matching Red Hat's documented install flow.
# Verify channel names against the target cluster's OCP/OSSM compatibility matrix —
# not validated against a live cluster.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kiali-ossm
  namespace: openshift-operators
spec:
  channel: stable
  name: kiali-ossm
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: jaeger-product
  namespace: openshift-operators
spec:
  channel: stable
  name: jaeger-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator
  namespace: openshift-operators
spec:
  channel: stable
  name: servicemeshoperator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
