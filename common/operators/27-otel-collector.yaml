# OpenTelemetryCollector receiving OTLP from the mesh's Envoy sidecars and exporting to Tempo
# (26-tempo.yaml). The exporter endpoint targets the Service TempoMonolithic creates for its
# OTLP gRPC receiver. Confirmed live: the Tempo Operator double-prefixes generated resources
# with the CR name (CR named "tempo" -> Service "tempo-tempo" exposing 3200/4317/4318), not a
# separate "tempo-query-frontend" Service -- verify against `oc get svc -n istio-system` if the
# CR is renamed.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: istio-system
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc: {}
          http: {}
    exporters:
      otlp/tempo:
        endpoint: tempo-tempo.istio-system.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp/tempo]
