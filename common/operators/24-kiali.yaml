# Apply only after the kiali-ossm subscription (20-service-mesh.yaml) has installed and
# 21-istio.yaml's Istio control plane is Ready. Kiali is no longer an SMCP addon in 3.x --
# it's a standalone kiali.io/v1alpha1 Kiali CR.
#
# external_services.grafana/tracing URLs below assume the Grafana (25-grafana.yaml) and Tempo
# (26-tempo.yaml) service names created by this build -- confirm exact service hostnames
# against the live cluster (`oc get svc -n istio-system`) before relying on the Kiali UI's
# Grafana/tracing deep links.
apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
spec:
  istio_namespace: istio-system
  auth:
    strategy: openshift
  deployment:
    ingress_enabled: true
  external_services:
    istio:
      component_status:
        enabled: true
    prometheus:
      auth:
        type: bearer
        use_kiali_token: true
      thanos_proxy:
        enabled: true
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
    grafana:
      enabled: true
      internal_url: http://grafana-service.istio-system:3000
    tracing:
      enabled: true
      provider: tempo
      internal_url: http://tempo-query-frontend.istio-system:3200
      use_grpc: false
