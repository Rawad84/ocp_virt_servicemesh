# Apply only after the servicemeshoperator/kiali-ossm/jaeger-product subscriptions
# (20-service-mesh.yaml) have finished installing — the ServiceMeshControlPlane CRD
# won't exist until then.
#
# Named "basic" in istio-system because module-3's ServiceMeshMember resources
# (module-3-service-mesh-observability/manifests/servicemeshmember.yaml) reference
# controlPlaneRef.name=basic, controlPlaneRef.namespace=istio-system.
apiVersion: maistra.io/v2
kind: ServiceMeshControlPlane
metadata:
  name: basic
  namespace: istio-system
spec:
  version: v2.6
  tracing:
    type: Jaeger
    sampling: 10000
  addons:
    jaeger:
      name: jaeger
      install:
        storage:
          type: Memory
    kiali:
      enabled: true
      name: kiali
    grafana:
      enabled: true
  gateways:
    ingress:
      enabled: true
    egress:
      enabled: true
