# Allows istio-ingressgateway -> control-vm. Applied here for the Module 4 walkthrough;
# from Module 5 onward this exact resource is owned by the travel-control Helm chart's
# own ap-allow-selective-principals-travel-control.yaml template — excluded from Module
# 5's GitOps Application for that reason.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-selective-principals-travel-control
  namespace: travel-control
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
