# One PodMonitor per mesh namespace, not one cluster-wide PodMonitor in istio-system --
# OpenShift's user-workload-monitoring Prometheus hardcodes `ignoreNamespaceSelectors: true`
# and silently discards any `namespaceSelector` a PodMonitor sets (confirmed live: with
# namespaceSelector.any=true, the generated scrape config still only listed
# `namespaces: {names: [istio-system]}`, and /api/v1/targets showed zero results) -- a
# deliberate OpenShift multi-tenancy boundary, not a bug. Each namespace needs its own copy of
# this PodMonitor, defaulting to same-namespace pod discovery.
#
# See common/operators/28-monitoring-integration.yaml for the istiod ServiceMonitor, the
# Kiali RBAC binding, and the (must-be-merged-not-clobbered) user-workload-monitoring
# ConfigMap this depends on.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-proxies-monitor
  namespace: travel-agency
spec:
  selector:
    matchExpressions:
      - key: istio-prometheus-ignore
        operator: DoesNotExist
  podMetricsEndpoints:
    - path: /stats/prometheus
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: ["__meta_kubernetes_pod_container_name"]
          regex: "istio-proxy"
        - action: keep
          sourceLabels: ["__meta_kubernetes_pod_annotationpresent_prometheus_io_scrape"]
        - action: replace
          regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
          replacement: '[$2]:$1'
          sourceLabels: ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
          targetLabel: "__address__"
        - action: replace
          regex: (\d+);((([0-9]+?)(\.|$)){4})
          replacement: '$2:$1'
          sourceLabels: ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
          targetLabel: "__address__"
        - action: labeldrop
          regex: "__meta_kubernetes_pod_label_(.+)"
        - sourceLabels: ["__meta_kubernetes_namespace"]
          action: replace
          targetLabel: namespace
        - sourceLabels: ["__meta_kubernetes_pod_name"]
          action: replace
          targetLabel: pod_name
---
