# Joins each Travel Booking namespace to the "basic" ServiceMeshControlPlane
# (see common/operators/21-service-mesh-control-plane.yaml).
---
apiVersion: maistra.io/v1
kind: ServiceMeshMember
metadata:
  name: default
  namespace: travel-agency
spec:
  controlPlaneRef:
    name: basic
    namespace: istio-system
---
apiVersion: maistra.io/v1
kind: ServiceMeshMember
metadata:
  name: default
  namespace: travel-control
spec:
  controlPlaneRef:
    name: basic
    namespace: istio-system
---
apiVersion: maistra.io/v1
kind: ServiceMeshMember
metadata:
  name: default
  namespace: travel-portal
spec:
  controlPlaneRef:
    name: basic
    namespace: istio-system
