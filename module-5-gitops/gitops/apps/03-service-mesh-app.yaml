apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travel-agency-service-mesh
  namespace: openshift-gitops
  labels:
    module: m5
spec:
  project: default
  source:
    repoURL: <GIT_REPO_URL>
    targetRevision: HEAD
    path: module-3-service-mesh-observability/manifests
    directory:
      recurse: true
      # .sh scripts here (add-envoy-to-*.sh) are one-time imperative helpers used during
      # Module 3's walkthrough, not declarative desired state — ArgoCD's directory source
      # only picks up *.yaml/*.yml/*.json anyway, so no explicit exclude is needed for them.
      #
      # NOTE: module-3-service-mesh-observability/manifests/ has no membership CR to sync
      # (OSSM 3.4's Sail Operator has no ServiceMeshMember equivalent — mesh membership is
      # cluster-wide by default, injection is controlled per-workload). This Application
      # currently has nothing to manage; kept for structural symmetry with the other modules
      # in case future mesh-scoped config (e.g. a Sidecar resource) lands here.
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
