# Three customer-facing travel shops, running as plain container Deployments (per the
# lab: "The components in this namespace are running as containers"). Ported near-verbatim
# from https://raw.githubusercontent.com/kiali/demos/master/travels/travel_portal.yaml,
# with an explicit namespace added to each resource.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voyages
  namespace: travel-portal
spec:
  selector:
    matchLabels:
      app: voyages
      version: v1
  replicas: 1
  template:
    metadata:
      labels:
        app: voyages
        version: v1
    spec:
      containers:
        - name: voyages
          image: quay.io/kiali/demo_travels_portal:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LISTEN_ADDRESS
              value: ":8000"
            - name: PORTAL_COORDINATES
              value: "48.861310,2.337418"
            - name: PORTAL_COUNTRY
              value: "France"
            - name: PORTAL_NAME
              value: "voyages.fr"
            - name: TRAVELS_AGENCY_SERVICE
              value: "http://travels-vm.travel-agency.svc.cluster.local:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: voyages
  namespace: travel-portal
  labels:
    app: voyages
spec:
  ports:
    - name: http
      port: 8000
  selector:
    app: voyages
---
