# Backend MySQL database used by cars/flights/hotels/insurances.
# Password intentionally simple/fixed for lab use — rotate before any non-lab use.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: mysqldb-vm
  namespace: travel-agency
  labels:
    app: mysqldb-vm
spec:
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: fedora-mysqldb
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  runStrategy: Always
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: fedora
        vm.kubevirt.io/workload: server
      labels:
        kubevirt.io/domain: mysqldb-vm
        kubevirt.io/size: small
        app: mysqldb-vm
        version: v1
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              name: default
          rng: {}
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        machine:
          type: pc-q35-rhel9.4.0
        memory:
          guest: 2Gi
        resources: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
        - dataVolume:
            name: fedora-mysqldb
          name: rootdisk
        - cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: fedora
              password: redhat
              chpasswd: { expire: False }
              ssh_pwauth: true
              runcmd:
              - loginctl enable-linger fedora
              - su - fedora -c 'XDG_RUNTIME_DIR=/run/user/$(id -u) DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus" systemctl --user daemon-reload'
              - su - fedora -c 'XDG_RUNTIME_DIR=/run/user/$(id -u) DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus" systemctl --user start mysqldb.service'
              write_files:
              - content: |
                  [Unit]
                  Description=Fedora MySQLDB Container

                  [Container]
                  Label=app=mysqldb-container
                  ContainerName=mysqldb-container
                  Image=quay.io/kiali/demo_travels_mysqldb:v1
                  Environment=MYSQL_ROOT_PASSWORD='mysqldbpass'
                  Exec=--default-authentication-plugin mysql_native_password
                  PodmanArgs=-p 3306:3306

                  [Install]
                  WantedBy=multi-user.target default.target

                  [Service]
                  Restart=always
                path: /etc/containers/systemd/users/mysqldb.container
                permissions: '0777'
                owner: root:root
          name: cloudinitdisk
